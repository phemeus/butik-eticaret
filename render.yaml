# Render Blueprint — test deploy
# Dashboard: New > Blueprint > repo bağla
# veya servisleri tek tek oluşturup env'leri kendin gir.

databases:
  - name: butik-db
    plan: free
    databaseName: butik_eticaret_production
    user: butik

services:
  - type: web
    name: butik-eticaret
    plan: free
    runtime: ruby
    buildCommand: "SECRET_KEY_BASE_DUMMY=1 DISABLE_DATABASE_ENVIRONMENT_CHECK=1 bundle install && SECRET_KEY_BASE_DUMMY=1 bundle exec rails assets:precompile"
    startCommand: "bash bin/render-start.sh"
    healthCheckPath: /up
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RAILS_LOG_TO_STDOUT
        value: "true"
      - key: RAILS_SERVE_STATIC_FILES
        value: "true"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: butik-db
          property: connectionString
      - key: RAILS_MASTER_KEY
        value: "037da71d8629692af76e1ca4da00a4f3"
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: APP_HOST
        fromService:
          type: web
          name: butik-eticaret
          property: host
