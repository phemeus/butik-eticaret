default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: butik_eticaret_development
  <% if ENV["DATABASE_HOST"].present? %>
  host: <%= ENV["DATABASE_HOST"] %>
  username: <%= ENV.fetch("DATABASE_USERNAME", "postgres") %>
  password: <%= ENV.fetch("DATABASE_PASSWORD", "postgres") %>
  <% else %>
  username: <%= ENV.fetch("DATABASE_USERNAME") { Etc.getpwuid.name } %>
  <% end %>

test:
  <<: *default
  database: butik_eticaret_test
  username: <%= ENV.fetch("DATABASE_USERNAME") { Etc.getpwuid.name } %>

production:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>
